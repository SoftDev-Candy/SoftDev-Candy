name: Generate Contribution Snake

on:
  # Automatically regenerate once per day
  schedule:
    - cron: "0 0 * * *"

  # Let me run it manually from GitHub
  workflow_dispatch:

  # Also regenerate when this workflow is changed
  push:
    branches:
      - main

jobs:
  generate:

    permissions:
      contents: write

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      # Generate the contribution snake
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3

        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-snake.svg?color_snake=#EE8C7C&color_dots=#161B22,#2E5D50,#7DD3C7,#F7C7A3,#C7B7E8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#EE8C7C&color_dots=#161B22,#2E5D50,#7DD3C7,#F7C7A3,#C7B7E8

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Put generated SVG files in an "output" branch
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0

        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
